[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spantrack"
description = "Convert text EPUBs into EPUB 3 with Media Overlays via local Kokoro TTS"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Özyay", email = "hi@efe.cv" }]
keywords = ["epub", "tts", "media-overlays", "kokoro", "audiobook"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Natural Language :: English",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  # spaCy models are not on PyPI, so misaki's G2P pins en_core_web_sm by wheel URL to
  # keep it offline (else misaki fires a runtime `spacy.cli.download`). Direct-URL deps
  # block a PyPI upload.
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "ftfy==6.3.1",
  "kokoro==0.9.4",
  "lxml>=5,<6",
  "misaki[en]==0.9.4",
  "numpy>=1.26,<3",
  "pysbd==0.3.4",
  "soundfile>=0.12,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
# Optional per-chapter progress bar, enabled with --progress. Kept out of the base
# install so the core has no reason to pull tqdm.
progress = ["tqdm>=4.66,<5"]

[dependency-groups]
test   = ["pytest>=8,<9", "syntok>=1.4,<2", "tqdm>=4.66,<5"]
lint   = ["ruff>=0.6"]
typing = ["pyright>=1.1", "lxml-stubs>=0.5"]

dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typing" },
]

[project.urls]
homepage = "https://github.com/ozefe/spantrack"
source   = "https://github.com/ozefe/spantrack"
issues   = "https://github.com/ozefe/spantrack/issues"

[project.scripts]
spantrack = "spantrack.cli:main"

[tool.hatch.version]
path = "src/spantrack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spantrack"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
pythonpath = ["src"]   # import spantrack from src/ without an install

[tool.ruff]
src            = ["src"] # first-party source root for import sorting
target-version = "py312" # warn on features unavailable in 3.12
fix            = true    # auto-apply safe fixes
show-fixes     = true    # log every applied fix

[tool.ruff.format]
docstring-code-format = true # reformat code snippets inside docstrings

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # incorrect-blank-line-before-class - conflicts with D211
  "D213",   # multi-line-summary-second-line    - conflicts with D212
  "D107",   # __init__ doesn't need a docstring
  "COM812", # missing-trailing-comma - conflicts with `ruff format`
  "CPY001", # LICENSE file already covers the copyright
  "FIX002", # TODOs are deliberate tech-debt markers, not lint failures
  "TD003",  # the project's TODO(name) style does not require issue links
]
task-tags = ["TODO", "FIXME", "XXX", "HACK"]

[tool.ruff.lint.isort]
known-first-party = ["spantrack"] # sort our imports into their own group

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # *args/**kwargs may use Any without annotation

[tool.ruff.lint.flake8-builtins]
strict-checking = true # compare module names, not full paths (A005)

[tool.ruff.lint.pycodestyle]
max-doc-length = 88 # documentation line length (W505)

[tool.ruff.lint.pydocstyle]
convention = "google" # enforce Google-style docstring sections

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",    # `assert` is the point in pytest
  "S603",    # subprocess calls in tests use fixed, controlled argv
  "PLR2004", # magic-number compares are normal in test code
  "ANN",     # over-annotating tests hurts readability
  "D",       # docstrings on every test function are noise
  "INP001",  # tests/ is intentionally not a package
  "SLF001",  # tests legitimately exercise `_private` attrs
  "EM101",   # short string literals in `raise` are fine in tests
  "EM102",   # f-string in `raise` is fine in tests
  "TRY003",  # exact messages are part of the test's assertion
  "TRY301",  # `raise` inside `try` is fine in tests that exercise it
  "RUF001",  # ambiguous-unicode is the point of the normalization corpus
  "RUF002",  # ambiguous-unicode in docstrings - same reason
  "RUF003",  # ambiguous-unicode in comments - same reason
]
"tests/test_text_normalization.py" = [
  "E501", # adversarial-string corpus rows can't wrap without hiding the data
]
"src/spantrack/tts/kokoro_backend.py" = [
  "PLC0415", # the kokoro import is deliberately lazy - it pulls torch, so importing this
  #            module (e.g. from the pipeline) must stay cheap for CLI startup
]
"src/spantrack/oov_report.py" = [
  "PLC0415", # the misaki import is lazy - it pulls spacy, so keep this module cheap to import
]
"examples/**/*.py" = [
  "INP001",  # each example is a standalone script, run directly, not an importable package
  "T201",    # examples print their results to stdout - that is what they are for
  "S101",    # a plain assert is a fine, readable sanity-check on an example's output
  "PLR2004", # inline literals read better than a constants block in a short teaching script
]

[tool.pyright]
include          = ["src", "tests"]
extraPaths       = ["tests"]        # resolve shared test-helper modules (conftest, oracle)
pythonVersion    = "3.12"
typeCheckingMode = "strict"
venvPath         = "."              # resolve third-party imports against the project venv
venv             = ".venv"
