<h1>The Lamp</h1>
<p>In 1892, old Marek climbed the tower every night. The lamp had to burn — that was the only rule. He trimmed the wick, poured the oil, and watched the dark water below.</p>
<p>Ships passed far out at sea. Their captains never saw his face, yet they trusted his small light more than the stars.</p>
